[project]
name = "vigilant-engine"
version = "0.1.0"
description = "Governed multi-agent control plane for autonomous software delivery."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.10,<3",
    "httpx>=0.27",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
bedrock = ["anthropic[bedrock]>=2.10,<3"]

[project.scripts]
vigilant = "vigilant_engine.interfaces.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigilant_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
